aid: sarwa
name: Sarwa
description: >-
  Sarwa is a UAE-based fintech platform and mobile app that lets everyday
  investors trade U.S. stocks and ETFs, invest passively through managed
  portfolios, and save in high-yield accounts, all in one place. The company
  is regulated by the Financial Services Regulatory Authority (FSRA) of the
  Abu Dhabi Global Market (ADGM) and operates as Sarwa Digital Wealth (Capital)
  Limited. Sarwa is a portfolio company of 500 Global and offers consumer
  products (Sarwa Trade, Sarwa Invest, Sarwa Save) through its web and mobile
  apps; it does not currently publish a public developer API. This profile
  captures the company's public identity, security posture, and web properties
  for the API Evangelist network.
